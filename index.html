<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Guilherme Maranhão</title>
	<meta name="description" content="Guilherme Maranhão — photography &amp; code">
	<meta name="color-scheme" content="light dark">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..700&display=swap" rel="stylesheet">
	<style>
		:root {
			--reserve: 16rem;     /* everything that isn't the photo; refined by the script below */
			--card: #777775;      /* 18% grey card */
			--paper: #f6f6f3;     /* fibre paper white */
			--ink: #1c1c1c;       /* pencil / text */
			--ink-soft: #5c5c5a;
			--keyline: #000;
			--below: #e9e9e6;     /* text sitting on the grey card */
			--focus: #1c1c1c;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--card: #2e2e2d;
				--paper: #191919;
				--ink: #ececea;
				--ink-soft: #a3a3a0;
				--below: #8e8e8b;
				--focus: #ececea;
			}
		}

		* { box-sizing: border-box; }

		html, body { margin: 0; height: 100%; }

		body {
			min-height: 100vh;
			min-height: 100dvh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 1.25rem;
			padding: 2.5rem 1.5rem;
			background: var(--card);
			color: var(--ink);
			font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
			font-weight: 400;
			font-variation-settings: "wdth" 100;
			-webkit-font-smoothing: antialiased;
		}

		/* The print: paper border, wider at the bottom where the caption goes */
		.print {
			/* image height = viewport height minus everything else; width follows at 3:2.
			   Fallbacks first for browsers without min() or dvh. */
			width: 1080px;
			max-width: 100%;
			width: min(1080px, 100%, max(18rem, calc((100vh - var(--reserve)) * 1.5 + 3rem + 4px)));
			width: min(1080px, 100%, max(18rem, calc((100dvh - var(--reserve)) * 1.5 + 3rem + 4px)));
			margin: 0;
			padding: 1.5rem 1.5rem 0;
			background: var(--paper);
			box-shadow: 0 1px 1px rgba(0,0,0,.18), 0 12px 32px -12px rgba(0,0,0,.35);
		}

		.print .frame {
			border: 2px solid var(--keyline);
			background: var(--keyline);
			line-height: 0;
		}

		.print .frame img {
			display: block;
			width: 100%;
			height: auto;
			aspect-ratio: 3 / 2;
			object-fit: cover;
			animation: develop 2.2s cubic-bezier(.3,.1,.2,1) .15s both;
		}

		@keyframes develop {
			from { filter: brightness(2.6) contrast(.35); opacity: .2; }
			60%  { opacity: 1; }
			to   { filter: none; opacity: 1; }
		}

		/* Bottom margin of the print */
		.margin {
			display: grid;
			grid-template-columns: auto 1fr auto;
			align-items: center;
			gap: 1rem;
			padding: 1.1rem 0 1.3rem;
		}

		.avatar {
			width: 3.25rem;
			height: 3.25rem;
			border: 1px solid var(--keyline);
			object-fit: cover;
			filter: grayscale(1);
		}

		h1 {
			margin: 0;
			font-size: clamp(1.35rem, 1rem + 1.4vw, 2.1rem);
			font-weight: 600;
			font-variation-settings: "wdth" 125;
			letter-spacing: -.01em;
			line-height: 1.05;
		}

		.role {
			margin: .3rem 0 0;
			font-size: .95rem;
			font-variation-settings: "wdth" 80;
			color: var(--ink-soft);
		}

		nav ul {
			display: flex;
			flex-wrap: wrap;
			justify-content: flex-end;
			gap: .2rem 1.25rem;
			margin: 0;
			padding: 0;
			list-style: none;
		}

		nav a {
			color: var(--ink);
			text-decoration: none;
			font-size: 1rem;
			font-variation-settings: "wdth" 80;
			font-weight: 500;
			padding: .25rem 0;
			background-image: linear-gradient(currentColor, currentColor);
			background-size: 0 1px;
			background-position: 0 100%;
			background-repeat: no-repeat;
			transition: background-size .25s ease;
		}
		nav a:hover { background-size: 100% 1px; }
		nav a:focus-visible {
			outline: 2px solid var(--focus);
			outline-offset: 3px;
		}

		footer {
			font-size: .8rem;
			font-variation-settings: "wdth" 80;
			color: var(--below);
		}
		footer a { color: inherit; }

		@media (max-width: 640px) {
			body { padding: 1rem .75rem 2rem; }
			.print { width: 100%; min-width: 0; padding: .75rem .75rem 0; }
			.margin {
				grid-template-columns: auto 1fr;
				row-gap: .9rem;
			}
			nav { grid-column: 1 / -1; }
			nav ul { justify-content: flex-start; gap: .35rem 1.1rem; }
			nav a { font-size: 1.05rem; padding: .35rem 0; }
		}

		@media (prefers-reduced-motion: reduce) {
			.print .frame img { animation: none; }
			nav a { transition: none; }
		}
	</style>
</head>
<body>

	<figure class="print">
		<div class="frame">
			<img src="images/bg.jpg" width="1440" height="960" alt="Black and white street photograph: people waiting at a crosswalk as a van and a truck pass between tall buildings.">
		</div>

		<figcaption class="margin">
			<img class="avatar" src="images/avatar.jpg" width="200" height="203" alt="">
			<div>
				<h1>Guilherme Maranhão</h1>
				<p class="role">Photography &amp; code</p>
			</div>
			<nav aria-label="Elsewhere">
				<ul>
					<li><a href="https://refotografia.wordpress.com/">Blog</a></li>
					<li><a href="https://refotografia.github.io/portfolio/">Portfolio</a></li>
					<li><a href="https://refotografia.bandcamp.com/">Sound</a></li>
					<li><a href="https://www.youtube.com/@refotografia">Youtube</a></li>
					<li><a href="https://github.com/refotografia">GitHub</a></li>
					<li><a href="https://exiliofoto.blogspot.com/">Ateliê</a></li>
				</ul>
			</nav>
		</figcaption>
	</figure>

	<footer>© Guilherme Maranhão</footer>

	<script>
		// Measure what surrounds the photo (padding, caption, footer) so the whole
		// page always fits in the window, whatever the font or line wrapping does.
		(function () {
			var root = document.documentElement;
			var print = document.querySelector('.print');
			var img = print.querySelector('.frame img');
			var foot = document.querySelector('footer');
			function fit() {
				if (window.matchMedia('(max-width: 640px)').matches) {
					root.style.removeProperty('--reserve');
					return;
				}
				for (var i = 0; i < 3; i++) { // caption may rewrap at the new width
					var cs = getComputedStyle(document.body);
					var total = foot.getBoundingClientRect().bottom - print.getBoundingClientRect().top
						+ parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
					var reserve = Math.ceil(total - img.getBoundingClientRect().height);
					if (root.style.getPropertyValue('--reserve') === reserve + 'px') break;
					root.style.setProperty('--reserve', reserve + 'px');
				}
			}
			fit();
			window.addEventListener('resize', fit);
			window.addEventListener('load', fit);
			if (document.fonts) document.fonts.ready.then(fit);
		})();
	</script>

</body>
</html>
